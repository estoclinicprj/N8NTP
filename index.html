<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire N8N</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #141414;
      --border: #2a2a2a;
      --accent: #c8f135;
      --accent-dim: rgba(200, 241, 53, 0.12);
      --text: #f0f0f0;
      --muted: #666;
      --error: #ff5f5f;
      --success: #c8f135;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Background grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* Accent glow blob */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(200,241,53,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
    }

    /* Header */
    .header {
      margin-bottom: 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-dim);
      border: 1px solid rgba(200,241,53,0.25);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(32px, 6vw, 44px);
      line-height: 1.1;
      color: var(--text);
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 300;
      line-height: 1.6;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,241,53,0.4), transparent);
    }

    /* Form groups */
    .fields-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
      transition: color 0.2s;
    }

    .field:focus-within label {
      color: var(--accent);
    }

    .input-wrap {
      position: relative;
    }

    input, textarea {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      -webkit-appearance: none;
    }

    input::placeholder, textarea::placeholder {
      color: #3a3a3a;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,241,53,0.08);
    }

    textarea {
      resize: none;
      height: 110px;
      line-height: 1.6;
    }

    /* Submit button */
    .btn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      box-shadow: 0 0 30px rgba(200,241,53,0.25);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-text { transition: opacity 0.2s; }
    .btn-loader { display: none; }

    .btn.loading .btn-text { display: none; }
    .btn.loading .btn-loader { display: flex; align-items: center; gap: 8px; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #0d0d0d;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
      opacity: 0;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .toast.success .toast-icon { background: rgba(200,241,53,0.15); color: var(--accent); }
    .toast.error .toast-icon { background: rgba(255,95,95,0.15); color: var(--error); }
    .toast.success { border-color: rgba(200,241,53,0.2); }
    .toast.error { border-color: rgba(255,95,95,0.2); }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    /* Field animation on mount */
    .field {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.4s forwards;
    }

    .fields-row .field:nth-child(1) { animation-delay: 0.05s; }
    .fields-row .field:nth-child(2) { animation-delay: 0.1s; }
    .field:nth-child(2) { animation-delay: 0.15s; }
    .field:nth-child(3) { animation-delay: 0.2s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-wrap {
      opacity: 0;
      animation: fadeUp 0.4s 0.3s forwards;
    }

    /* Footer note */
    .footer-note {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .footer-note span {
      color: var(--accent);
    }

    @media (max-width: 480px) {
      .fields-row { grid-template-columns: 1fr; }
      .card { padding: 24px; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header">
      <h1>Envoyez-nous<br>votre <em>message</em></h1>
      <p class="subtitle">Remplissez le formulaire ci-dessous. Vos données seront enregistrées automatiquement.</p>
    </div>

    <div class="card">
      <form id="form" autocomplete="off">

        <div class="fields-row">
          <div class="field">
            <label for="nom">Nom</label>
            <div class="input-wrap">
              <input type="text" id="nom" placeholder="" required autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="prenom">Prénom</label>
            <div class="input-wrap">
              <input type="text" id="prenom" placeholder="" required autocomplete="off">
            </div>
          </div>
        </div>

        <div class="field">
          <label for="email">Adresse email</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="" required autocomplete="off">
          </div>
        </div>

        <div class="divider"></div>

        <div class="field">
          <label for="message">Message</label>
          <div class="input-wrap">
            <textarea id="message" placeholder="" required></textarea>
          </div>
        </div>

        <div class="btn-wrap">
          <button type="submit" class="btn" id="submitBtn">
            <span class="btn-text">Envoyer →</span>
            <span class="btn-loader">
              <span class="spinner"></span>
              Envoi en cours...
            </span>
          </button>
        </div>

      </form>
    </div>


  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <div class="toast-icon" id="toastIcon"></div>
    <span id="toastMsg"></span>
  </div>

  <script>
    function showToast(type, message) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toastIcon');
      const msg = document.getElementById('toastMsg');

      toast.className = 'toast ' + type;
      icon.textContent = type === 'success' ? '✓' : '✕';
      msg.textContent = message;

      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      btn.classList.add('loading');
      btn.disabled = true;

      const data = {
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      try {
        // ⚠️ Remplace cette URL par l'URL de ton webhook N8N
        const response = await fetch('https://bytehq.app.n8n.cloud/webhook-test/formulaire-etudiant', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (response.ok) {
          showToast('success', 'Formulaire envoyé avec succès !');
          document.getElementById('form').reset();
        } else {
          showToast('error', 'Erreur serveur : ' + response.statusText);
        }
      } catch (error) {
        showToast('error', 'Connexion impossible. Vérifie l\'URL du webhook.');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
